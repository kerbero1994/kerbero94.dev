[build]
  publish = "site"

# Some crawlers ask for /favicon.png; serve the touch icon instead of a 404.
[[redirects]]
  from = "/favicon.png"
  to = "/apple-touch-icon.png"
  status = 200

# Security headers. The CSP line is generated by `npm run csp` (hashes of every inline
# script and style); edit the script, not this line.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Dt9MPSFOaBdUE/IThTJ4Xro80HcbS2q+XplWOJRxnb8=' 'sha256-cdQm1cFNSuB0WILTgRg6WzEPDkmcPiY7JcRIg8r8BVU=' 'sha256-sNuC33YpqIpvzkRhjpLUpteFsXgLPVAMbB6S2A2YOqw=' 'sha256-zQkLt72L+STQwrCchVBq4QeHFPY0sCWtrM2gSAPhIkY='; style-src 'self' 'sha256-GpUwtd5eNz8kYJvrVO5/NxeAHTGyhtXv7hylcn7i8HE=' 'sha256-W+Xal1iCBcfR2U6s0PpsCXFa4DPaQqLbUcEBbjf37VQ=' 'sha256-r17YnH6cp5jjL/9oGRvNsvYJCc0/V2NnOyKDVHfNveQ=' 'sha256-tr23av5UzdLaU6vMUButUewVDNMEBeqapxT/4qGKR2w=' 'sha256-vu+JxNFaqh2zVTO+08wyfX9+jGNhTRoKNWZbOnq2F40='; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' https://ingesteer.services-prod.nsvcs.net; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Fonts never change under the same name: cache for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and video: 30 days. Give a changed image a new file name.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
