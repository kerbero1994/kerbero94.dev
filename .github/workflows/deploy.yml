# Production: a merge to main that changes the published site runs the same gate as
# pull requests, on exactly what ships, then deploys and smoke-tests kerbero94.dev.
# Each production deploy costs 15 of the 300 monthly Netlify credits and the site
# pauses when they run out, so dependency updates (outside site/) don't deploy.
# Rollback: Netlify > Deploys > the previous one > Publish deploy (no credits).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "netlify.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  NETLIFY_SITE_ID: c35e5d83-d442-4541-adae-b92cea9da71b
  NETLIFY_CLI: netlify-cli@27.20.1

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Deploy to production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes "$NETLIFY_CLI" deploy --prod --dir site --site "$NETLIFY_SITE_ID" --message "${{ github.sha }}"
      - name: Smoke test kerbero94.dev
        run: bash checks/smoke.sh
      - name: Security headers grade A+ (Mozilla HTTP Observatory)
        run: bash checks/observatory.sh
