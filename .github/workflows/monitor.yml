# Production monitoring. Daily: smoke test (pages, PDF, redirects, certificate days),
# security headers grade (A+), DNS hardening, the Netlify token and this period's
# deploy count (credits), and the static suite (it fails 30 days before security.txt
# expires). Uptime every 5 minutes lives in uptime.yml. Mondays: Lighthouse, mobile and desktop, against the
# real CDN. A failure emails the repo owner.
name: Monitor

on:
  schedule:
    - cron: "0 14 * * *"  # daily, 08:00 in Mexico City
    - cron: "30 14 * * 1" # Mondays: Lighthouse too
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: bash checks/smoke.sh
      - run: bash checks/observatory.sh
      - run: bash checks/dns.sh
      - name: Netlify token and credits
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: c35e5d83-d442-4541-adae-b92cea9da71b
        run: bash checks/netlify-account.sh
      - run: npm test

  lighthouse:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 14 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        form: [mobile, desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: |
          npx lhci collect ${{ matrix.form == 'desktop' && '--settings.preset=desktop' || '' }}
          npx lhci upload
          npx lhci assert
        env:
          LHCI_ORIGIN: https://kerbero94.dev
      - if: always()
        run: |
          { echo "### Lighthouse on kerbero94.dev, median of 3 runs, ${{ matrix.form }}"; node checks/lh-summary.mjs; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "lighthouse-production-${{ matrix.form }}", path: .lighthouseci, include-hidden-files: true }
