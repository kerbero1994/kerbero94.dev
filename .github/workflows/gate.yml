# The quality gate. Pull requests (pr.yml) and production (deploy.yml) both call this
# file, so what blocks a merge is exactly what blocks a deploy. Read-only.
name: Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: HTML validity and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:static

  a11y:
    name: axe, 5 pages x 10 styles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: (npm run serve &) && curl -sf --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8791/
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: a11y-result, path: checks/result.json }

  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chrome, browser: "" } # the runner's Google Chrome
          - { project: firefox, browser: firefox }
          - { project: webkit-iphone, browser: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v6
        if: matrix.browser != ''
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - if: matrix.browser != ''
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.project }}
          path: playwright-report

  visual:
    name: visual regression, 55 screens
    # Skipped while pr.yml refreshes the baselines.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'update-visuals') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright test --project=visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: visual-diff, path: playwright-report }

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx lhci autorun
      - if: always()
        run: |
          { echo "### Lighthouse, median of 3 runs, mobile"; node checks/lh-summary.mjs; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: lighthouse, path: .lighthouseci, include-hidden-files: true }
