# The quality gate. Pull requests (pr.yml) and production (deploy.yml) both call this
# file, so what blocks a merge is exactly what blocks a deploy. Read-only.
# Every job uploads a result-* artifact, pass or fail, for the PR quality report.
# Job names are required status checks on main: rename one, update the branch protection.
name: Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: no secrets in the history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks over every commit
        run: |
          mkdir -p results && chmod 777 results
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact \
            --report-format json --report-path /repo/results/gitleaks.json --exit-code 1
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: result-secrets, path: results }

  static:
    name: HTML validity, unit tests, CSP, spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:static
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: result-static, path: results }

  a11y:
    name: axe, 5 pages x 10 styles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: (npm run serve &) && curl -sf --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8791/
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: result-a11y, path: checks/result.json }

  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chrome, browser: "" } # the runner's Google Chrome
          - { project: firefox, browser: firefox }
          - { project: webkit-iphone, browser: webkit }
    env:
      PW_JSON: results/e2e-${{ matrix.project }}.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v6
        if: matrix.browser != ''
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - if: matrix.browser != ''
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: result-e2e-${{ matrix.project }}
          path: results
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.project }}
          path: playwright-report

  visual:
    name: visual regression, 57 screens
    # Skipped while pr.yml refreshes the baselines.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'update-visuals') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PW_JSON: results/visual.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright test --project=visual
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: result-visual, path: results }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: visual-diff, path: playwright-report }

  lighthouse:
    name: Lighthouse budgets (${{ matrix.form }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        form: [mobile, desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx lhci autorun ${{ matrix.form == 'desktop' && '--collect.settings.preset=desktop' || '' }}
      - if: always()
        run: |
          { echo "### Lighthouse, median of 3 runs, ${{ matrix.form }}"; node checks/lh-summary.mjs; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "result-lighthouse-${{ matrix.form }}", path: .lighthouseci/reports, include-hidden-files: true }
