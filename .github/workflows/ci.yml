# CI: every pull request runs the same check as `npm run check`, then gets a
# Netlify preview. Previews cost no Netlify credits; production deploys do
# (15 of 300 a month on the free plan), so production lives in deploy.yml and
# only runs when main changes what's published.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: c35e5d83-d442-4541-adae-b92cea9da71b
  NETLIFY_CLI: netlify-cli@27.20.1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Serve the site
        run: python3 -m http.server 8791 --bind 127.0.0.1 --directory site &
      - name: axe on 5 pages x 10 styles, links, console errors, overflow at 390 px
        run: npm run check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-result
          path: checks/result.json

  preview:
    needs: check
    # Forks get no secrets; skip instead of failing.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy a preview (no credits)
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes "$NETLIFY_CLI" deploy --dir site --site "$NETLIFY_SITE_ID" \
            --alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }} ${{ github.sha }}" --json > deploy.json
          echo "url=$(node -p 'require("./deploy.json").deploy_url')" >> "$GITHUB_OUTPUT"
      - name: Link the preview on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none \
            --body "Preview of ${{ github.sha }}: ${{ steps.deploy.outputs.url }}"
