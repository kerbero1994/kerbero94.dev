# Pull requests: the gate, then a Netlify preview linked on the PR. Previews cost no
# Netlify credits; production deploys do, so those live in deploy.yml.
# Label a PR "update-visuals" to re-render the visual baselines in CI and commit them.
name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: c35e5d83-d442-4541-adae-b92cea9da71b
  NETLIFY_CLI: netlify-cli@27.20.1

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  preview:
    needs: gate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Deploy a preview (no credits)
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes "$NETLIFY_CLI" deploy --dir site --site "$NETLIFY_SITE_ID" \
            --alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }} ${{ github.sha }}" --json > deploy.json
          echo "url=$(node -p 'require("./deploy.json").deploy_url')" >> "$GITHUB_OUTPUT"
      - name: Link the preview and the metrics on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none \
            --body "Preview of ${{ github.sha }}: ${{ steps.deploy.outputs.url }}. Gate passed; Lighthouse table in the run summary: $RUN"

  update-visuals:
    if: contains(github.event.pull_request.labels.*.name, 'update-visuals') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.head_ref }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright test --project=visual --update-snapshots
      - name: Commit the new baselines and drop the label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          git diff --cached --quiet || git commit -m "Update visual baselines (rendered in CI)"
          git push
          gh pr edit ${{ github.event.number }} --remove-label update-visuals
