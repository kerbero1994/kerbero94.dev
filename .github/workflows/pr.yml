# Pull requests: the gate, a Netlify preview recorded as a GitHub deployment, and a
# quality report a bot keeps up to date as one comment on the PR. Previews cost no
# Netlify credits; production deploys do, so those live in deploy.yml.
# Label a PR "update-visuals" to re-render the visual baselines in CI and commit them.
name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: c35e5d83-d442-4541-adae-b92cea9da71b
  NETLIFY_CLI: netlify-cli@27.20.1

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  preview:
    needs: gate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Deploy a preview (no credits)
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes "$NETLIFY_CLI" deploy --dir site --site "$NETLIFY_SITE_ID" \
            --alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }} ${{ github.sha }}" --json > deploy.json
          echo "url=$(node -p 'require("./deploy.json").deploy_url')" >> "$GITHUB_OUTPUT"

  report:
    name: quality report
    needs: [gate, preview]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v7
        with: { pattern: result-*, path: artifacts }
      - name: Create or update the report comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
        run: node checks/pr-report.mjs

  update-visuals:
    if: contains(github.event.pull_request.labels.*.name, 'update-visuals') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.head_ref }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright test --project=visual --update-snapshots
      - name: Commit the new baselines and drop the label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__snapshots__
          git diff --cached --quiet || git commit -m "Update visual baselines (rendered in CI)"
          git push
          gh pr edit ${{ github.event.number }} --remove-label update-visuals
